name: Publish npm packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/create-bunestro/**"
      - "packages/bunestro-wrapper/**"

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Bun handles install, build and scripting. npm is only needed for
      # `npm publish --provenance` (trusted publishing via OIDC), which
      # `bun publish` doesn't support. Node 26's bundled npm (11.x) does.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install create-bunestro dependencies
        working-directory: packages/create-bunestro
        run: bun install

      - name: Check versions
        id: version_check
        working-directory: packages/create-bunestro
        run: |
          CB_NAME=$(bun -p "require('./package.json').name")
          CB_VERSION=$(bun -p "require('./package.json').version")
          echo "name=$CB_NAME" >> $GITHUB_OUTPUT
          echo "version=$CB_VERSION" >> $GITHUB_OUTPUT

          CB_PUBLISHED=$(bun pm view "$CB_NAME@$CB_VERSION" version 2>/dev/null || echo "")
          if [ "$CB_PUBLISHED" = "$CB_VERSION" ]; then
            echo "cb_already_published=true" >> $GITHUB_OUTPUT
          else
            echo "cb_already_published=false" >> $GITHUB_OUTPUT
          fi

          CB_MAJOR=$(echo $CB_VERSION | cut -d. -f1)
          CB_MINOR=$(echo $CB_VERSION | cut -d. -f2)
          CB_PATCH=$(echo $CB_VERSION | cut -d. -f3)
          WRAPPER_MAJOR=$((CB_MAJOR + 1))
          NEW_WRAPPER_VERSION="$WRAPPER_MAJOR.$CB_MINOR.$CB_PATCH"
          echo "new_wrapper_version=$NEW_WRAPPER_VERSION" >> $GITHUB_OUTPUT

          WRAPPER_PUBLISHED=$(bun pm view "@ardly/bunestro@$NEW_WRAPPER_VERSION" version 2>/dev/null || echo "")
          if [ "$WRAPPER_PUBLISHED" = "$NEW_WRAPPER_VERSION" ]; then
            echo "wrapper_already_published=true" >> $GITHUB_OUTPUT
          else
            echo "wrapper_already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish create-bunestro
        if: steps.version_check.outputs.cb_already_published == 'false'
        working-directory: packages/create-bunestro
        run: npm publish --provenance --access public

      - name: Sync and publish @ardly/bunestro wrapper
        if: steps.version_check.outputs.wrapper_already_published == 'false'
        working-directory: packages/bunestro-wrapper
        run: |
          CB_VERSION="${{ steps.version_check.outputs.version }}"
          NEW_WRAPPER_VERSION="${{ steps.version_check.outputs.new_wrapper_version }}"
          WRAPPER_VERSION=$(bun -p "require('./package.json').version")

          echo "Bumping wrapper from $WRAPPER_VERSION to $NEW_WRAPPER_VERSION"

          bun -e "
            const pkg = await Bun.file('package.json').json();
            pkg.version = '$NEW_WRAPPER_VERSION';
            pkg.dependencies['create-bunestro'] = '^$CB_VERSION';
            await Bun.write('package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "

          echo "Waiting for create-bunestro@$CB_VERSION to be available on npm..."
          for i in {1..12}; do
            FOUND=$(bun pm view "create-bunestro@$CB_VERSION" version 2>/dev/null || echo "")
            if [ "$FOUND" = "$CB_VERSION" ]; then
              echo "Found on registry!"
              break
            fi
            echo "Not yet available, retrying in 10s... ($i/12)"
            sleep 10
          done

          bun install
          npm publish --provenance --access public

      - name: Commit updated wrapper package.json
        if: steps.version_check.outputs.wrapper_already_published == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/bunestro-wrapper/package.json
          git commit -m "pack: sync @ardly/bunestro to create-bunestro@${{ steps.version_check.outputs.version }}"
          git push
