name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install site dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Install create-bunestro dependencies
        working-directory: packages/create-bunestro
        run: bun install --frozen-lockfile

      - name: Build create-bunestro
        working-directory: packages/create-bunestro
        run: bun run build
